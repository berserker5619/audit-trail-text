name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # trusted publishing and npm provenance

env:
  CI: true

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle check
        run: npm run check:bundle

      - name: Tests (Node and jsdom)
        run: npm test

      - name: Tests in other time zones
        run: |
          TZ=Asia/Kolkata npm test
          TZ=America/Los_Angeles npm test

      # CI runs these on Mongoose 7, 8 and 9; the release checks the version in the lockfile.
      - name: Mongoose plugin tests
        run: npm run test:mongoose

      # Trusted publishing needs npm >= 11.5.1. Pinned, not @latest, so a release does not change
      # the tool that publishes it on the day a new npm comes out. Raise it deliberately.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@12.2.0
          echo "npm $(npm --version) on node $(node --version)"

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json is $VERSION but tag is $TAG"
            exit 1
          fi
          echo "Tag and package.json match: $TAG"

      # npm can only trust this workflow once the package exists, so the first version is
      # published by hand. Fail clearly rather than with an auth error.
      - name: Package already exists on registry
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        run: |
          if OUT=$(npm view audit-trail-text version 2>&1); then
            echo "audit-trail-text is on the registry at $OUT"
          else
            case "$OUT" in
              *E404*)
                echo "::error::First publish needed for audit-trail-text: publish it by hand, then add this workflow as its trusted publisher"
                exit 1
                ;;
              *)
                echo "::error::Could not reach registry"
                echo "$OUT"
                exit 1
                ;;
            esac
          fi

      # Prereleases (1.0.0-rc.1) go to next; stable versions go to latest and move next up.
      - name: Publish audit-trail-text
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        run: node scripts/release-publish.mjs

      - name: Pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run
