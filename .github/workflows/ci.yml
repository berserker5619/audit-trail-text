name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 0

jobs:
  # Node is pinned in .nvmrc: Intl output comes from Node's ICU data, and the golden sentences
  # are checked against one version. Raise it deliberately and regenerate the goldens.
  gate:
    name: Typecheck, build, bundle check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Bundle check
        run: npm run check:bundle
      - name: Tests (Node and jsdom)
        run: npm test

  # Sentences must not depend on the machine's time zone.
  timezones:
    name: Tests with TZ=${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, Asia/Kolkata, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  # The Mongoose plugin against a real database (an in-memory replica set, so sessions and
  # transactions are real), on every Mongoose major it supports.
  mongoose:
    name: MongoDB ${{ matrix.mongodb }}, Mongoose ${{ matrix.mongoose }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ['6.0.29', '7.0.45', '8.0.34']
        mongoose: [7, 8, 9]
    env:
      MONGOMS_VERSION: ${{ matrix.mongodb }}
      # 6.0 and 7.0 have no Ubuntu 24.04 builds; the 22.04 builds run on it.
      MONGOMS_DISTRO: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Mongoose ${{ matrix.mongoose }}
        run: |
          npm install --no-save --no-audit --no-fund mongoose@${{ matrix.mongoose }}
          VERSION=$(node -p "require('mongoose/package.json').version")
          echo "Mongoose $VERSION"
          case "$VERSION" in ${{ matrix.mongoose }}.*) ;; *) echo "::error::expected Mongoose ${{ matrix.mongoose }}, got $VERSION"; exit 1 ;; esac
      - name: Mongoose plugin tests, hooks and stream mode
        run: npm run test:mongoose
      - name: Stream mode with the plain driver
        run: npm run test:mongo

  # Integration with Dynamic Entity (integration/dynamic-entity, not published): every write is
  # checked against DE's own diffEntityRecords, for typed and loose storage, in hooks mode and in
  # stream mode. Mongoose 8 runs the full 2,000 runs per config, split by config across six jobs;
  # 7 and 9 run the core suite at 200. Each job also runs the path, plugin-off-versus-on and
  # guarantee tests.
  dynamic-entity:
    name: Dynamic Entity, Mongoose ${{ matrix.mongoose }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mongoose: 8, runs: 2000, shard: 'configs 1', only: 'complexFullTest,clients' }
          - { mongoose: 8, runs: 2000, shard: 'configs 2', only: 'employees,organizations' }
          - { mongoose: 8, runs: 2000, shard: 'configs 3', only: 'visitNotes,insuranceClaims' }
          - { mongoose: 8, runs: 2000, shard: 'configs 4', only: 'people,patientIntake' }
          - { mongoose: 8, runs: 2000, shard: 'configs 5', only: 'itAssets,allTypes' }
          - { mongoose: 8, runs: 2000, shard: 'configs 6', only: 'masked,renamed' }
          - { mongoose: 7, runs: 200 }
          - { mongoose: 9, runs: 200 }
    defaults:
      run:
        working-directory: integration/dynamic-entity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integration/dynamic-entity/package-lock.json
      - name: Build this checkout, which the harness uses in place of the published package
        working-directory: .
        run: npm ci && npm run build
      - run: npm ci
      - name: Install Mongoose ${{ matrix.mongoose }}
        run: |
          npm install --no-save --no-audit --no-fund mongoose@${{ matrix.mongoose }}
          VERSION=$(node -p "require('mongoose/package.json').version")
          echo "Mongoose $VERSION"
          case "$VERSION" in ${{ matrix.mongoose }}.*) ;; *) echo "::error::expected Mongoose ${{ matrix.mongoose }}, got $VERSION"; exit 1 ;; esac
      - name: Dynamic Entity uses this checkout
        run: |
          node -e "const r=require('module').createRequire(require.resolve('@dynamic-entity/core/history'));const p=r.resolve('audit-trail-text');if(!require('fs').realpathSync(p).startsWith(require('path').resolve('../..')))throw new Error(p);console.log(p)"
      - name: Typecheck the harness
        run: npm run typecheck
      - name: Tests
        run: npm test
        env:
          DE_RUNS: ${{ matrix.runs }}
          DE_ONLY: ${{ matrix.only }}

  # The package promises Node >= 18. Tests run TypeScript directly and need a newer Node, so the
  # built output is checked on the oldest supported Node instead.
  oldest-node:
    name: Built package on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - run: node scripts/smoke.mjs
